name: Template CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Generate & Check (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: minimal
            args: >-
              -d project_type=library
              -d ask_for_async=false -d ask_for_web=false
              -d ask_common_libs=anyhow,thiserror,rand
          - scenario: async
            args: >-
              -d ask_for_async=true -d multi_choice=rt-multi-thread,macros,time
              -d ask_for_web=false
              -d ask_common_libs=uuid,serde_json,chrono,tracing,dashmap,rayon
          - scenario: web-axum
            args: >-
              -d ask_for_async=false -d ask_for_web=true -d choice=axum
              -d ask_common_libs=serde_json,reqwest
          - scenario: web-actix
            args: >-
              -d ask_for_async=true -d multi_choice=full
              -d ask_for_web=true -d choice=actix-web
              -d ask_common_libs=anyhow,clap
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate,nextest,cargo-deny
      - name: Generate project from template
        run: >-
          cargo generate --path . --name ci-smoke --silent
          --destination ${{ runner.temp }}
          -d gh_username=ci -d description="CI smoke test" -d license=MIT
          ${{ matrix.args }}
      - name: cargo fmt
        working-directory: ${{ runner.temp }}/ci-smoke
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: ${{ runner.temp }}/ci-smoke
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo doc
        working-directory: ${{ runner.temp }}/ci-smoke
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: cargo nextest
        working-directory: ${{ runner.temp }}/ci-smoke
        run: cargo nextest run --all-features --no-tests pass
      - name: cargo deny
        working-directory: ${{ runner.temp }}/ci-smoke
        run: cargo deny check

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.50.1
